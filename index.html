<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Meta Lens — an independent concept exploring life beyond the phone. Interactive demo coming soon.">
  <meta name="theme-color" content="#071421">
  <title>Meta Lens · Life beyond the phone</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; background: #071421; color: #f7fbff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; }
    main { min-height: 100svh; display: flex; flex-direction: column; padding: clamp(24px, 6vw, 80px); }
    header { font-size: 1rem; letter-spacing: .14em; text-transform: uppercase; }
    .content { width: min(100%, 1000px); margin: auto 0; padding: 90px 0; }
    .eyebrow { color: #93c7ef; font-size: .875rem; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: clamp(3rem, 8vw, 7.5rem); letter-spacing: -.055em; font-weight: 500; line-height: 1; margin: 26px 0 36px; max-width: 100%; }
    .status { color: #b7c7d6; font-size: clamp(1.125rem, 2vw, 1.5rem); line-height: 1.6; margin: 0; }
    footer { border-top: 1px solid #354554; padding-top: 22px; font-size: .875rem; color: #a6b8c8; line-height: 1.6; }
    @media (max-width: 480px) { .content { padding: 70px 0; } h1 { letter-spacing: -.045em; } }
  </style>
</head>
<body>
  <main>
    <header>Meta Lens</header>
    <section class="content" aria-labelledby="headline">
      <p class="eyebrow">A spatial computing concept</p>
      <h1 id="headline">Life beyond<br>the phone.</h1>
      <p class="status">Interactive concept demo coming soon.</p>
    </section>
    <footer>Independent student concept. Not a Meta product or an announcement of available technology.</footer>
  </main>
</body>
</html>
